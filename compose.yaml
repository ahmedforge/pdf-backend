services:
  db:
    image: postgres:16

    environment:
      POSTGRES_DB: pdf_backend
      POSTGRES_USER: pdf_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdf_user -d pdf_backend"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+psycopg://pdf_user:${POSTGRES_PASSWORD}@db:5432/pdf_backend
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

    volumes:
      - ./uploads:/app/uploads

    depends_on:
      db:
        condition: service_healthy

    command: >
      sh -c "alembic upgrade head &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data: